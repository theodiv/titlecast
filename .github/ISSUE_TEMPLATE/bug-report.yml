name: Report a bug
description: >-
  Report a defect in Titlecast. Security vulnerabilities must be reported
  via GitHub's private advisory feature, not this form.
title: "bug: <short description>"
labels: [bug, triage]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: >-
            The issue is not already reported in
            [open issues](https://github.com/theodiv/titlecast/issues?q=is:issue+state:open).
          required: true

  - type: input
    id: version
    attributes:
      label: Titlecast version
      description: The reference in the `uses:` line, such as `theodiv/titlecast@v0`.
    validations:
      required: true

  - type: input
    id: runner
    attributes:
      label: Runner image
      placeholder: ubuntu-24.04
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: The observed behavior, then the expected behavior.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >-
        The smallest workflow, with its `with:` values, that shows the defect.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Observed output
      description: >-
        The output or error line, exactly as written, with secrets
        and personal data replaced with `REDACTED`.
      render: text
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Anything a maintainer cannot infer.
    validations:
      required: false
